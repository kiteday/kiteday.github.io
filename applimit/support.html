<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <title>앱리밋 고객지원</title>
  <style>
    :root { color-scheme:light dark; --bg:#f5f7fb; --card:#fff; --text:#17202b; --muted:#697586; --line:#e2e7ef; --accent:#2f7899; }
    @media (prefers-color-scheme:dark) { :root { --bg:#050505; --card:#171717; --text:#f5f5f5; --muted:#aaa; --line:#303030; --accent:#54b4df; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; line-height:1.7; }
    main { width:min(680px,calc(100% - 36px)); margin:0 auto; padding:56px 0 80px; }
    h1 { font-size:36px; margin:0 0 8px; }
    .lead { color:var(--muted); margin-bottom:30px; }
    section { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 26px; margin:14px 0; }
    h2 { margin:0 0 8px; font-size:19px; }
    p { margin:6px 0; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>앱리밋 고객지원</h1>
    <p class="lead">앱 이용 중 문제가 생기거나 개선 의견이 있다면 알려주세요.</p>
    <section>
      <h2>문의하기</h2>
      <p><a href="mailto:hyemin086@naver.com">hyemin086@naver.com</a></p>
      <p>기기 모델, iOS 버전, 문제가 발생한 화면을 함께 적어주시면 확인에 도움이 됩니다.</p>
    </section>
    <section>
      <h2>Screen Time 권한</h2>
      <p>앱 사용 시간을 측정하려면 Screen Time 권한이 필요합니다. 권한 상태는 iOS 설정에서 변경할 수 있습니다.</p>
    </section>
    <section>
      <h2>데이터</h2>
      <p>앱의 설정은 기기에만 저장됩니다. 앱을 삭제하면 설정도 함께 삭제되며 복구할 수 없습니다.</p>
    </section>
    <section>
      <h2>개인정보</h2>
      <p><a href="index.html">앱리밋 개인정보처리방침 보기</a></p>

</html>
