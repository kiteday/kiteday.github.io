<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiteday Apps</title>
  <style>
    :root { color-scheme:light dark; --bg:#f5f7fb; --card:#fff; --text:#17202b; --muted:#697586; --line:#e2e7ef; --accent:#2f7899; }
    @media (prefers-color-scheme:dark) { :root { --bg:#050505; --card:#171717; --text:#f5f5f5; --muted:#aaa; --line:#303030; --accent:#54b4df; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,sans-serif; line-height:1.7; }
    main { width:min(680px,calc(100% - 36px)); margin:0 auto; padding:64px 0 80px; }
    h1 { margin:0 0 8px; font-size:38px; }
    .lead { color:var(--muted); margin-bottom:30px; }
    section { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px 26px; }
    h2 { margin:0 0 8px; }
    a { color:var(--accent); }
    nav { display:flex; flex-wrap:wrap; gap:16px; margin-top:18px; }
  </style>
</head>
<body>
  <main>
    <h1>Kiteday Apps</h1>
    <p class="lead">Simple tools made for everyday life.</p>
    <section>
      <h2>AppLimit · 앱리밋</h2>
      <p>Set a separate daily limit for each app and build healthier screen-time habits. Screen Time selections and limit settings stay on your device.</p>
      <nav>
        <a href="applimit/en/">Privacy Policy</a>
        <a href="applimit/en/support.html">Support</a>
        <a href="applimit/" lang="ko">개인정보처리방침</a>
        <a href="applimit/support.html" lang="ko">고객지원</a>
      </nav>
    </section>
  </main>
</body>
</html>
